# AndroidX package structure configuration
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# --- PERFORMANCE OPTIMIZATIONS ---
# Increased RAM allocation to 2GB and added G1 Garbage Collector for smoother builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Enables parallel execution for multi-module builds to speed up compilation
org.gradle.parallel=true

# Enables configuration caching to skip unnecessary configuration phases
org.gradle.configuration-cache=true
# ----------------------------------

android.nonTransitiveRClass=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false